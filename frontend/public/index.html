  <body>
    <div id="root"></div>
    <!-- React owns menus, filters, forms, tables and charts. Loading the old
         jQuery templates here blocked React and could mutate its controls. -->
    <script src="%PUBLIC_URL%/template-enhancements.js" defer></script>

    <!-- Dịch website -->
    <div class="gtranslate_wrapper"></div>
    <script>
      // Dịch website
      window.gtranslateSettings = {
        default_language: "vi",
        wrapper_selector: ".gtranslate_wrapper",
      };
      // Hết Dịch website
      document.querySelectorAll(".gtranslate_wrapper").forEach(function (el) {
        var origAdd = el.addEventListener;
        el.addEventListener = function (type, listener, options) {
          if (
            (type === "pointerenter" || type === "focusin") &&
            typeof listener === "function"
          ) {
            return origAdd.call(
              this,
              type,
              function () {
                return listener.call(this);
              },
              options,
            );
          }
          return origAdd.call(this, type, listener, options);
        };
      });
    </script>
    <script src="%PUBLIC_URL%/load-language-widget.js" defer></script>
    <!-- Hết Dịch website -->
  </body>
