# Optional multi-node example. Include the upstream in the http{} block and
# replace the existing /socket.io/ location with the location below.
# All backend nodes MUST share MySQL, JWT policy, URL_REACT and SOCKET_REDIS_URL.
# Configure trusted real_ip sources when running behind a CDN/LB, or use that
# provider's cookie affinity; hashing the proxy IP sends everyone to one node.
upstream socket_nodes {
    hash $remote_addr consistent;
    server backend-1:5000;
    server backend-2:5000;
}
