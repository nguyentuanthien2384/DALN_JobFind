name: Realtime integration
on:
  push:
    paths: ['backend/**', 'frontend/src/container/Chat/**', 'frontend/src/container/header/**', 'frontend/src/container/system/Header*', 'frontend/src/container/system/Menu*', 'frontend/src/push/**', 'frontend/public/push-sw.js', 'frontend/src/auth/sessionExpiry*', 'frontend/src/socket*', 'frontend/src/service/userService*', 'frontend/src/util/useAutoRefresh*', '.github/workflows/realtime.yml']
  pull_request:
    paths: ['backend/**', 'frontend/src/container/Chat/**', 'frontend/src/container/header/**', 'frontend/src/container/system/Header*', 'frontend/src/container/system/Menu*', 'frontend/src/push/**', 'frontend/public/push-sw.js', 'frontend/src/auth/sessionExpiry*', 'frontend/src/socket*', 'frontend/src/service/userService*', 'frontend/src/util/useAutoRefresh*', '.github/workflows/realtime.yml']
permissions:
  contents: read
jobs:
  mysql-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: realtime-ci-disposable
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prealtime-ci-disposable"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm test -- --silent
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run test:unit -- --runTestsByPath src/container/Chat/ChatPage.test.js src/container/Chat/conversationSync.test.js src/container/Chat/reliableSend.test.js src/util/useAutoRefresh.test.js src/push/webPush.test.js src/push/PushSettings.test.js src/container/header/Header.test.js src/container/system/AdminNavigation.test.js src/auth/sessionExpiry.test.js
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: backend
      - run: node scripts/realtime/push-browser.cjs
        working-directory: backend
      - name: Create isolated TLS certificate for encrypted push acceptance
        run: |
          mkdir -p .local/push-test-tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .local/push-test-tls/local.key -out .local/push-test-tls/local.crt -days 1 -subj '/CN=localhost' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost'
      - run: npm run test:chat:infrastructure
        working-directory: backend
        env:
          CHAT_TEST_BROWSERS: 'true'
          CHAT_TEST_CONVERSATION: 'true'
          CHAT_TEST_CHAOS: 'true'
          CHAT_TEST_PUSH: 'true'
          CHAT_TEST_PUSH_TLS_DIR: ../.local/push-test-tls
          CHAT_TEST_MYSQL_URL: mysql://root:realtime-ci-disposable@127.0.0.1:3306/mysql
          CHAT_TEST_REDIS_URL: redis://127.0.0.1:6379
