name: Microservices quality
on:
  push:
    paths: ['microservices/**', 'backend/**', 'frontend/**', '.github/workflows/microservices.yml']
  pull_request:
    paths: ['microservices/**', 'backend/**', 'frontend/**', '.github/workflows/microservices.yml']
permissions:
  contents: read
concurrency:
  group: microservices-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-background:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Cache disposable infrastructure images
        run: |
          docker pull mysql:8.0
          docker pull mongo:7
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull rabbitmq:4-management-alpine
          docker pull docker.elastic.co/elasticsearch/elasticsearch:8.15.0
      - name: Accept background chain with actual services and synthetic AI on an internal Compose network
        working-directory: microservices
        run: npm run test:compose-background:integration
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JOBFIND_IMAGE: jobfind-microservices:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            microservices/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: microservices
      - run: npm test
        working-directory: microservices
      - run: npm run contracts:check
        working-directory: microservices
      - run: npm audit --omit=dev --audit-level=high
        working-directory: microservices
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Verify job writes and private management reads on disposable MySQL
        working-directory: microservices
        run: |
          docker pull mysql:8.0
          npm run test:job-writes:integration
      - name: Verify legacy applications and pipeline recovery on disposable databases and broker
        working-directory: microservices
        run: |
          docker pull postgres:16-alpine
          docker pull rabbitmq:4-management-alpine
          npm run test:application-sync:integration
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verify recruiter browser journeys on disposable MySQL and Redis
        working-directory: microservices
        run: |
          npx --no-install playwright install --with-deps chromium
          docker pull redis:7-alpine
          npm run test:job-browser:integration
      - name: Build candidate AI and Core search frontend for browser acceptance
        working-directory: frontend
        env:
          REACT_APP_CANDIDATE_AI_ENABLED: 'true'
          REACT_APP_APPLICATION_PROGRESS_ENABLED: 'true'
          REACT_APP_JOB_SEARCH_MODE: core
          REACT_APP_BACKEND_URL: /
        run: npm run build
      - name: Verify candidate CV and Core search browser journeys with synthetic API data
        working-directory: microservices
        run: npm run test:candidate-browser:integration
      - name: Validate local Compose without production credentials
        working-directory: microservices
        env:
          JWT_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          INTERNAL_SECRET: ci-only-internal-0123456789-abcdefghijklmnopqrstuvwxyz
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          RABBITMQ_USER: ci_user
          RABBITMQ_PASSWORD: ci_password
        run: docker compose -f docker-compose.yml -f compose.local.yml --profile monitoring config --quiet
      - name: Build immutable commit image
        working-directory: microservices
        run: docker build -t "$JOBFIND_IMAGE" .
      - name: Exercise packaged gateway with no external network
        working-directory: microservices
        run: node scripts/test-image.mjs
      - name: Verify event contracts on an isolated broker
        working-directory: microservices
        run: |
          docker pull rabbitmq:4-management-alpine
          npm run test:event-contracts:integration
      - name: Verify search convergence on disposable Elasticsearch
        working-directory: microservices
        run: |
          docker pull docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          npm run test:search-projection:integration
      - name: Validate monitoring rules
        working-directory: microservices
        run: |
          node scripts/prepare-local.mjs
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint promtool -v "$PWD/ops:/etc/prometheus:ro" -v "$PWD/.secrets/metrics-token:/run/secrets/metrics_token:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
